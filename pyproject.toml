[project]
name = "qwen35-zh-plaintext-compressor"
version = "0.1.0"
description = "Standalone training scaffold for the Qwen3.5 Chinese plain-text compressor project."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "datasets>=2.19.0",
    "peft>=0.11.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

